services:

  kurrentdb:
    image: kurrentplatform/kurrentdb:26.2
    restart: unless-stopped
    environment:
      KURRENTDB_INSECURE: "true"
      KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP: "true"
    ports:
      - "2113:2113"
    volumes:
      - kurrentdb:/var/lib/kurrentdb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2113/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:9.0
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "${MONGODB_PORT}:27017"
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: banking-ledger-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      KURRENTDB_URL: kurrentdb://kurrentdb:2113?tls=false
      MONGODB_URL: mongodb://mongodb:27017/banking-ledger
      API_PORT: ${API_PORT}
      WEB_ORIGIN: http://localhost:${PORT}
    depends_on:
      kurrentdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  projections:
    image: banking-ledger-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["run", "apps/api/src/features/projection/projections.ts"]
    environment:
      KURRENTDB_URL: kurrentdb://kurrentdb:2113?tls=false
      MONGODB_URL: mongodb://mongodb:27017/banking-ledger
    depends_on:
      kurrentdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    deploy:
      replicas: 2

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${PORT}:${PORT}"
    environment:
      PORT: ${PORT}
      API_PORT: ${API_PORT}
    depends_on:
      - api

volumes:
  kurrentdb:
  mongodb:
