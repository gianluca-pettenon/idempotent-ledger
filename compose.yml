services:

  kurrentdb:
    image: docker.kurrent.io/kurrent-latest/kurrentdb:26.1
    environment:
      KURRENTDB_INSECURE: "true"
      KURRENTDB_RUN_PROJECTIONS: None
    ports:
      - "2113:2113"
    volumes:
      - kurrentdb:/var/lib/kurrentdb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2113/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - readmodel:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["bun", "run", "apps/api/src/db/db.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  projector:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["bun", "run", "apps/api/src/features/projection/projection.service.ts"]
    restart: unless-stopped
    environment:
      KURRENTDB_URL: kurrentdb://kurrentdb:2113?tls=false
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      kurrentdb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      KURRENTDB_URL: kurrentdb://kurrentdb:2113?tls=false
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WEB_ORIGIN: http://localhost:${PORT}
    depends_on:
      kurrentdb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT}/api
    env_file: .env
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      api:
        condition: service_started

volumes:
  kurrentdb:
  readmodel:
