services:

  kurrentdb:
    image: docker.kurrent.io/kurrent-latest/kurrentdb:26.1
    environment:
      KURRENTDB_INSECURE: "true"
      KURRENTDB_RUN_PROJECTIONS: None
      KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP: "true"
    ports:
      - "2113:2113"
    volumes:
      - kurrentdb:/var/lib/kurrentdb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2113/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8
    ports:
      - "${MONGODB_PORT}:27017"
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One process per read-model view, each with its own checkpoint.
  balances-projector: &projector
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["bun", "run", "apps/api/src/features/projection/services/balances.projector.ts"]
    restart: unless-stopped
    environment:
      KURRENTDB_URL: kurrentdb://kurrentdb:2113?tls=false
      MONGODB_URL: mongodb://mongodb:27017/banking-ledger
    depends_on:
      kurrentdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  statements-projector:
    <<: *projector
    command: ["bun", "run", "apps/api/src/features/projection/services/statements.projector.ts"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      KURRENTDB_URL: kurrentdb://kurrentdb:2113?tls=false
      MONGODB_URL: mongodb://mongodb:27017/banking-ledger
      WEB_ORIGIN: http://localhost:${PORT}
    depends_on:
      kurrentdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT}/api
    env_file: .env
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      api:
        condition: service_started

volumes:
  kurrentdb:
  mongodb:
