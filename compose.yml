services:

  kurrentdb:
    image: docker.kurrent.io/kurrent-latest/kurrentdb:26.1
    environment:
      KURRENTDB_INSECURE: "true"
      KURRENTDB_RUN_PROJECTIONS: None
    ports:
      - "2113:2113"
    volumes:
      - kurrentdb:/var/lib/kurrentdb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2113/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      KURRENTDB_URL: kurrentdb://kurrentdb:2113?tls=false
      WEB_ORIGIN: http://localhost:${PORT}
    depends_on:
      kurrentdb:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT}/api
    env_file: .env
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      api:
        condition: service_started

volumes:
  kurrentdb:
